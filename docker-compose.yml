services:
  api:
    build: .
    image: telecom-churn-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  app:
    image: telecom-churn-api
    command: ["R", "-e", "shiny::runApp('app', host = '0.0.0.0', port = 3838)"]
    environment:
      API_URL: http://api:8000
    ports:
      - "3838:3838"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
