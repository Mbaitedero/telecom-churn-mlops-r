name: CI

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      # Binaires précompilés pour Ubuntu 24.04 (évite de tout compiler)
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/latest
    steps:
      - uses: actions/checkout@v4

      - name: Bibliothèques système
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
            libsodium-dev libgit2-dev libuv1-dev libglpk-dev libgmp-dev libpq-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libjpeg-dev libtiff-dev libicu-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"

      - uses: r-lib/actions/setup-renv@v2

      - name: Tests unitaires
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
